<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0b10">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · {{ app_name }}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
  <script src="/static/js/theme-init.js?v={{ asset_version }}"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#3fa2ff"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#bm)"/><path d="M16 8v11m0 0-4.5-4.5M16 19l4.5-4.5M10 23.5h12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">{{ app_name }}</span>
          <span class="brand-tagline">Private download server</span>
        </span>
      </span>
    </div>
  </header>

  <main id="main" class="container main login-main">
    <section class="card hero-card login-card" aria-labelledby="loginTitle">
      <h1 id="loginTitle" class="section-title">Sign in</h1>
      <p class="section-sub">This server is private. Enter the password to continue.</p>
      <form method="post" action="/login" class="login-form">
        <label for="password" class="visually-hidden">Password</label>
        <div class="url-field{% if error %} is-invalid{% endif %}">
          <svg class="url-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus
                 maxlength="512" placeholder="Password"{% if error %} aria-describedby="loginError" aria-invalid="true"{% endif %}>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
      </form>
      {% if error %}<p id="loginError" class="field-hint is-error" role="alert">{{ error }}</p>{% endif %}
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Only download videos you own or have permission to download.</p>
      <p class="footer-meta">v{{ version }}</p>
    </div>
  </footer>
</body>
</html>
